<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandro Lodieu — Portfolio</title>
    <meta name="description" content="Minimal and premium portfolio of Alexandro Lodieu, video editor and content creator. Inspired by clean aesthetic and visual excellence.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Soft Cloud Background Elements (CSS Animated) -->
    <div class="sky-background"></div>
    <div class="sky-glow"></div>

    <!-- Main Container -->
    <main class="main-container" id="mainContainer">
        
        <!-- Navigation Bar -->
        <nav class="nav-bar" id="mainNav">
            <div class="nav-logo">
                <span class="logo-dot"></span>
                <span class="logo-text">Alexandro Lodieu</span>
            </div>
            <div class="nav-social">
                <a href="https://www.instagram.com/mestari.studio/" target="_blank" rel="noopener noreferrer" class="nav-social-link" id="navInstagramLink">
                    <svg class="instagram-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                    <span>mestari.studio</span>
                </a>
            </div>
        </nav>

        <!-- Selected Work Section -->
        <section class="portfolio-section" id="portfolioSection">
            <header class="portfolio-header">
                <div class="header-bg-text">PORTFOLIO</div>
                <h1 class="header-title">/SELECTED WORK</h1>
            </header>

            <!-- Video Grid (Rendered dynamically via app.js) -->
            <div class="video-grid" id="videoGrid">
                <!-- Video cards will be injected here -->
            </div>
        </section>

        <!-- Divider Line -->
        <hr class="section-divider">

        <!-- Contact Section -->
        <section class="contact-section" id="contactSection">
            <!-- Availability Badge -->
            <div class="availability-badge" id="availabilityBadge">
                <span class="badge-dot"></span>
                <span class="badge-text">Available for New Project</span>
            </div>

            <!-- Heading -->
            <h2 class="contact-heading">HAVE A PROJECT IN MIND?</h2>

            <!-- Subtitle/Description -->
            <p class="contact-description">
                Together, we can create something clear and impactful. Let's collaborate to bring our ideas to life in a way that resonates with everyone.
            </p>

            <!-- Call to Action Button -->
            <div class="cta-container">
                <a href="https://www.instagram.com/mestari.studio/" target="_blank" rel="noopener noreferrer" class="contact-btn" id="contactCtaBtn">
                    <span>Contact Me</span>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="17" x2="17" y2="7"></line>
                        <polyline points="7 7 17 7 17 17"></polyline>
                    </svg>
                </a>
            </div>

            <!-- Footer Pills -->
            <footer class="footer-badges" id="footerBadges">
                <!-- Profile Pill -->
                <div class="footer-pill profile-pill" id="profilePill">
                    <img src="image/alexprofile_cropped.png" alt="Alexandro Lodieu" class="profile-image-cropped">
                    <span class="pill-text-white">Alexandro Lodieu</span>
                </div>

                <!-- Instagram Pill -->
                <a href="https://www.instagram.com/mestari.studio/" target="_blank" rel="noopener noreferrer" class="footer-pill social-pill" id="instagramPill">
                    <svg class="instagram-icon-pill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                    <span class="pill-text-dark">Instagram</span>
                </a>
            </footer>
        </section>

    </main>

    <!-- JavaScript File -->
    <script src="app.js"></script>
</body>
</html>
